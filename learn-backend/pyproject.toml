[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-quiz-backend"
version = "0.1.0"
description = "AI 知识闯关小程序 MVP 后端"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "beautifulsoup4>=4.15,<4.16",
  "fastapi>=0.142.2,<0.143",
  "httpx2>=2.13.1,<2.14",
  "openai>=3.24,<3.25",
  "pydantic-settings>=2.15,<3",
  "uvicorn[standard]>=0.54,<0.55",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.4,<2.5",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1,<7.2",
  "ruff>=0.16.10,<0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_quiz"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ai_quiz"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["，", "：", "！", "？"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ai_quiz"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true
